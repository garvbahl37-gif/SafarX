<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SafarX">
  <!-- SafarX mark, distilled for small sizes.
       The full logo carries a peacock, a skyline and the wordmark; none of that
       survives 16px, so this keeps only what identifies the brand: the gold S,
       one feather, and the deep green tile. Palette is the design system's
       "Peacock & Gold". -->
  <defs>
    <linearGradient id="sx-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E5BE5C"/>
      <stop offset="0.55" stop-color="#D4A843"/>
      <stop offset="1" stop-color="#A67E2B"/>
    </linearGradient>
    <linearGradient id="sx-feather" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1E7A6B"/>
      <stop offset="0.6" stop-color="#1796A0"/>
      <stop offset="1" stop-color="#1F5F8B"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="15"
        fill="#0A2620" stroke="url(#sx-gold)" stroke-width="2"/>

  <!-- Peacock feather, sweeping in from the lower left behind the S -->
  <path d="M14 47c-2-9 3-17 11-20 3-1 5 1 4 4-2 7-8 13-15 16z"
        fill="url(#sx-feather)" opacity="0.95"/>
  <ellipse cx="19.5" cy="40.5" rx="3.1" ry="4" fill="#0A2620" opacity="0.75"
           transform="rotate(-32 19.5 40.5)"/>
  <ellipse cx="19.5" cy="40.5" rx="1.5" ry="2.1" fill="url(#sx-gold)"
           transform="rotate(-32 19.5 40.5)"/>

  <!-- The S -->
  <path d="M42.5 21.5c0-5.5-17-6-17 2.5 0 7.5 17 6.5 17 14.5 0 8-17 8-17 2"
        fill="none" stroke="url(#sx-gold)" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
