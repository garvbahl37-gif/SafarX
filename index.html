<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="mask-icon" href="/favicon.svg" color="#D4A843" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="SafarX — Your companion for Incredible India. Preview heritage sites in 360° VR, discover hidden gems, track flights, and plan your perfect journey." />
  <meta name="theme-color" content="#061412" />

  <!-- Social Sharing (Open Graph) -->
  <meta property="og:title" content="SafarX — Discover Incredible India" />
  <meta property="og:description"
    content="Preview India's heritage in 360° VR, plan AI itineraries, and keep your travel documents secure — all in one place." />
  <meta property="og:image" content="/og-image.jpg" />
  <meta property="og:type" content="website" />

  <!-- CRITICAL: Kill stale service workers BEFORE anything loads -->
  <!-- This fixes blank page on normal reload after redeployment -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
      caches.keys().then(function (cacheNames) {
        cacheNames.forEach(function (cacheName) {
          caches.delete(cacheName);
        });
      });
    }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&family=Space+Grotesk:wght@300..700&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap"
    rel="stylesheet" />

  <title>SafarX — Discover Incredible India</title>
</head>

</body>
